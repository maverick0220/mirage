# RQ5: boiler full-year industrial validation.
# Runnable core requires the full-year CSV to be preprocessed first:
#   mirage preprocess --config configs/data/boiler_full_year.yaml --output data/processed/boiler/full_year
# then point data_dir at that output. Sampling/lag/regime sweeps are planned but
# not wired into the runner.
# NOTE (paper decision 2026-08-06): the full-year data has NO event ground truth.
# Quantitative metrics (Table 2/3 boiler rows) come from CONTROLLED INJECTION on
# expert-confirmed normal segments; real events are only qualitative case reviews.
# Running this config without injection labels produces scores only (no event F1).
research_question: RQ5_boiler_validation
seed: 2026
data_dir: data/processed/boiler/full_year
run_dir: artifacts/rq5_boiler
model_config: configs/model/mirage.yaml
batch_size: 128
num_workers: 0
max_epochs: 50
accelerator: auto
devices: 1
deterministic: true
fast_dev_run: false
limit_train_batches: 1.0
limit_val_batches: 1.0
# --- planned sweep (not executed by the current runner) ---
data_config: configs/data/boiler_full_year.yaml
sampling_seconds: [5, 30, 60]
lag_minutes: [1, 5, 10]
regime_counts: [3, 5, 8]
seeds: [2026, 2027, 2028, 2029, 2030]
metrics: [event_f1, range_auprc, false_alarms_per_day, delay, hit_at_3, runtime]
