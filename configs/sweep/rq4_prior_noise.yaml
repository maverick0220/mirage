# RQ4: prior robustness + dual-graph ablation.
# Method names encode the variant:
#   mirage_soft              -> full model, soft prior  (Table-4 "完整MIRAGE" row)
#   mirage_single            -> single-graph backbone (Table-4 "去除角色分图" row)
#   mirage_none / mirage_hard-> no / hard prior
#   mirage_corr<rate>        -> soft prior corrupted at the given edge-flip rate
research_question: RQ4_prior_robustness
kind: mirage
data_dir: data/processed/synthetic/default
artifact_root: artifacts
report_root: reports
window_size: 32
epochs: 10
batch_size: 128
max_lag: 3
seeds: [2026, 2027, 2028, 2029, 2030]
methods: [mirage_soft, mirage_single, mirage_none, mirage_hard, mirage_corr0.1, mirage_corr0.3, mirage_corr0.5]
model_config: configs/model/mirage.yaml
max_epochs: 50
num_workers: 0
accelerator: auto
devices: 1
deterministic: true
fast_dev_run: false
limit_train_batches: 1.0
limit_val_batches: 1.0
