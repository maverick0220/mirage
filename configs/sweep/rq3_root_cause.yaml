# RQ3: root-cause ranking.
# MIRAGE root-cause metrics (Hit@1/3/5, MRR) come from the evaluation pass over
# stored events; graph_residual_reference is the anomaly-baseline contrast
# (root-cause columns are NaN for it by design).
research_question: RQ3_root_cause
kind: mirage
data_dir: data/processed/synthetic/default
artifact_root: artifacts
report_root: reports
window_size: 32
epochs: 10
batch_size: 128
max_lag: 3
seeds: [2026, 2027, 2028, 2029, 2030]
methods: [mirage, graph_residual_reference]
expected_edges:
  - [load_context, setpoint, 1, 1.0]
  - [process_7, actuator_command, -1, 1.0]
  - [setpoint, actuator_command, 1, 1.0]
  - [actuator_command, actuator_feedback, 1, 1.0]
  - [actuator_feedback, process_0, 1, 1.0]
  - [load_context, process_0, 1, 1.0]
  - [process_0, process_1, 1, 1.0]
  - [process_1, process_2, 1, 1.0]
  - [process_2, process_3, 1, 1.0]
  - [process_3, process_4, 1, 1.0]
  - [process_4, process_5, 1, 1.0]
  - [process_5, process_6, 1, 1.0]
  - [process_6, process_7, 1, 1.0]
  - [actuator_feedback, process_1, 2, 1.0]
model_config: configs/model/mirage.yaml
max_epochs: 50
num_workers: 0
accelerator: auto
devices: 1
deterministic: true
fast_dev_run: false
limit_train_batches: 1.0
limit_val_batches: 1.0
